[package]
name = "clients-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "onehub"
path = "src/main.rs"

[dependencies]
abi-c = { path = "../../crates/abi-c" }
aes-gcm = "0.10"
futures-util = "0.3"
russh = { version = "0.61.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.3"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time", "macros"] }
base64 = "0.22"
argon2 = "0.5"
getrandom = "0.2"
mysql_async = { version = "0.36.1", features = ["rustls-tls"] }
tokio-postgres = { version = "0.7.15", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
duckdb = { version = "1.10501.0", features = ["bundled"] }
tiberius = { version = "0.12.3", default-features = false, features = ["chrono", "rustls", "tds73", "winauth"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
tiny_http = "0.12"
ureq = "2"
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Security_Cryptography"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }