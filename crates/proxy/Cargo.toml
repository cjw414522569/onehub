[package]
name = "proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
core-domain = { path = "../core-domain" }
core-protocol = { path = "../core-protocol" }
forwarding = { path = "../forwarding" }
tokio = { version = "1", features = ["net", "time", "io-util", "rt", "macros", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "test-util", "net", "sync", "io-util"] }

