[package]
name = "transfer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
core-domain = { path = "../core-domain" }
core-protocol = { path = "../core-protocol" }
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "fs", "io-util"] }
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "test-util", "sync", "io-util"] }

