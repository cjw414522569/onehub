apiVersion: v1
kind: Service
metadata:
  name: ssh-gateway
  labels:
    app.kubernetes.io/name: ssh-gateway
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: ssh-gateway
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: gateway